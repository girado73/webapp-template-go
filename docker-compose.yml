services:
  app:
    build:
      context: ./app
    volumes:
        - ./app:/app
    ports:
      - "8000:8000"
    networks:
      - app-network 

  web:
    build:
      context: ./web
      target: dev
    depends_on:
      - app
    volumes:
      - ./web:/web
    ports:
      - "80:80"
      - "5173:5173"
    networks:
      - app-network

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:

networks:
  app-network:
    driver: bridge
