services:
  app:
    build:
      context: ./app
    volumes:
        - ./app:/app
    ports:
      - "8000:8000"
    networks:
      - app-network 

  web:
    build:
      context: ./web/
    ports:
      - "80:80"
    volumes:
      - ./web:/web
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./web/dist:/usr/share/nginx/html:ro
    networks:
      - app-network
networks:
  app-network:
    driver: bridge